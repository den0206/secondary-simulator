name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  # push が無い週でも Xcode 更新の破壊に気づくため（xcode-canary 用）
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # 型チェックとテストはネイティブサイドカーを要らないので Linux でも回る。
  # macOS ランナーが枯渇している間もここが赤くなれば壊れたことに気づける
  # （docs/project-review.md §6）。build:native は非 macOS で自動スキップされる。
  quick-check:
    name: TypeCheck & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # ネイティブサイドカー(clang / Objective-C)と VSIX の梱包に macOS が要るため
  # マトリクスは張らずに macOS 1本だけ回す。Linux/Windows では build:native が
  # 自動スキップされ、そもそも iOS Simulator も動かない。
  build-and-test:
    name: TypeCheck, Test & Package
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (TypeScript + simhid-server)
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify build artifacts
        run: |
          test -f out/extension.js || { echo "::error::out/extension.js がありません"; exit 1; }
          test -x native/simhid-server || { echo "::error::native/simhid-server がありません"; exit 1; }
          # 配布 VSIX は 1 つで Intel/Apple Silicon 両方を賄うので universal を必須にする
          lipo -info native/simhid-server | grep -q 'x86_64 arm64' \
            || { echo "::error::simhid-server が universal binary ではありません"; exit 1; }

      - name: Xcode 私有 API チェック
        run: sh scripts/check-xcode-hid.sh

      - name: Package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: vsix/*.vsix
          retention-days: 7

      # ここから先はシミュレータを実際に動かす。単体テストは HID コマンドを組み立てる
      # ところまでしか見ないので、注入そのものが壊れても気づけない
      # （check-xcode-hid.sh もシンボルが解決できるかしか見ていない）。
      # VSIX の upload より後に置いてあるのは、ここが落ちても成果物は残るようにするため。
      - name: シミュレータを起動
        id: sim
        run: |
          # Pro / Max / e を除いた標準モデルの最新。Xcode が更新されて機種が
          # 入れ替わっても拾えるように、固定名では書かない。
          # **15 で下限を切っている** — tap-effect の TOP_CELL_Y は設定トップの
          # 縦配分に依存していて、それ以前の機種では比が合わない
          TYPE=$(xcrun simctl list devicetypes \
            | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[0-9]+\)' \
            | tr -d ')' | sort -t- -k2,2n | awk -F- '$NF >= 15' | tail -1)
          # unavailable なランタイムも列挙されるので先に外す。並び順は保証されない
          # ので、識別子の major/minor で数値ソートしてから最新を採る
          RT=$(xcrun simctl list runtimes \
            | grep -v unavailable \
            | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+(-[0-9]+)?' \
            | sort -t- -k2,2n -k3,3n | tail -1)
          echo "device type: $TYPE / runtime: $RT"
          [ -n "$TYPE" ] || { echo "::error::iPhone 15 以降の device type がありません"; exit 1; }
          [ -n "$RT" ] || { echo "::error::利用可能な iOS runtime がありません"; exit 1; }
          UDID=$(xcrun simctl create ci-device "$TYPE" "$RT")
          # boot が転けても「後片付け」が消せるように、作った直後に出す
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # **bootstatus は Data Migration の途中でも Finished を返すことがある**
          # （実測: "Waiting on Data Migration / Gathering plugins" のまま
          # Status=4294967295, isTerminal=YES）。その状態では HID クライアントを
          # 張れずに WDA へ降格するので、実際にアプリを起動できるまで待つ
          for _ in $(seq 60); do
            xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null 2>&1 && break
            sleep 2
          done
          xcrun simctl terminate "$UDID" com.apple.Preferences > /dev/null 2>&1 || true
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null \
            || { echo "::error::シミュレータがアプリを起動できる状態になりません"; exit 1; }
          xcrun simctl terminate "$UDID" com.apple.Preferences > /dev/null 2>&1 || true

      # HID 注入が実際に画面を動かすか（操作の前後をスクリーンショットで比べる）
      - name: 実操作テスト（HID 注入）
        id: tap
        env:
          # 落ちたときに比べた 2 枚が残る。変化の割合だけでは、注入が届かなかったのか
          # 想定した画面が出ていなかったのかが分からない。ランナーの temp に寄せて
          # 次のステップで拾えるようにする
          TMPDIR: ${{ runner.temp }}
        run: node test/tap-effect.device-test.js "${{ steps.sim.outputs.udid }}"

      - name: 失敗した画面を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tap-effect-screens
          path: ${{ runner.temp }}/tap-effect-*/*.bmp
          retention-days: 7
          if-no-files-found: ignore

      - name: 後片付け
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

  # build-and-test は macos-14 固定なので、新しい Xcode を積んだイメージでは回らない。
  # こちらは macos-latest（＝より新しい Xcode）で私有 API の解決だけを確認する。
  # 週次 cron で回るので、push が無い週の Xcode 更新にも気づける。
  xcode-canary:
    name: Xcode canary (private API)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Build simhid-server
        run: npm run build:native

      - name: Xcode 私有 API チェック
        run: sh scripts/check-xcode-hid.sh

  # Release の "Sync version to main" が落ちると package.json が古いまま残る。
  # ここが赤くなることで気づける。
  version-check:
    name: Version not behind latest release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ver_* タグの取得に必要

      - name: Compare package.json version with latest release tag
        run: |
          # +N は再ビルド番号で package.json には入らないため比較前に落とす
          LATEST="$(git tag -l 'Ver_*' | sed 's/^Ver_//; s/+.*//' | sort -V | tail -1)"
          CURRENT="$(node -p "require('./package.json').version")"

          if [ -z "$LATEST" ]; then
            echo "リリースタグがまだありません (current: $CURRENT)"
            exit 0
          fi

          # sort -V で新しい方が後ろに来る。同値なら CURRENT が返るので合格。
          if [ "$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)" != "$CURRENT" ]; then
            echo "::error::package.json の version ($CURRENT) が最新リリース Ver_$LATEST より古いままです。Release の main 同期が失敗した可能性があります"
            exit 1
          fi
          echo "OK: package.json $CURRENT >= 最新リリース $LATEST"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Secret scan (TruffleHog)
        # 可変 ref（@main）は上流が侵害された瞬間にこのジョブで任意コードが走る。
        # リリースの SHA で固定する（v3.97.0）。
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
