<main><h1>共有されたプラン</h1><p>このQRコードは、nademoのお出かけプランです。</p><p>nademoが入っている場合は、アプリの「QRから読み込む」で元のQRコードを読み取ってください。</p><p>アプリは現在、公開準備中です。公開後はApp Storeからインストールできます。</p><p>インストールした後は、元のQRコードをもう一度読み取ってください。インストールするだけでは、プランは引き継がれません。</p><p><a href="../support.html">読み取れないときの案内</a></p></main>
