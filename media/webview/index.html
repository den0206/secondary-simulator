<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{cspMeta}}
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <div class="toolbar">
    <div class="select-wrap">
      <select id="device">
        <option value="">Select Device…</option>
      </select>
    </div>
    <span class="lamp" id="lamp" title="切断中"></span>
    <button class="icon-btn" id="btn-refresh" title="デバイス一覧を再取得">↻</button>
  </div>

  <div class="stage">
    <div class="phone-frame">
      <span class="side-btn side-mute"></span>
      <span class="side-btn side-vol"></span>
      <span class="side-btn side-power"></span>
      <div class="simulator-container" id="simulator-container">
        <canvas id="simulator-canvas" style="display: none;"></canvas>
        <img id="simulator-img" style="display: none;" alt="" />
        <canvas id="touch-overlay"></canvas>
        <div class="overlay" id="overlay">
          <span>Select a device to start</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="control-btn" id="btn-home" title="Home">⌂ Home</button>
        <button class="control-btn" id="btn-back" title="Back">‹ Back</button>
      </div>
      <div class="btn-group">
        <button class="control-btn" id="btn-trail" title="タップのリップルとドラッグ軌跡の表示">Trail ON</button>
        <button class="control-btn" id="btn-auto" title="起動中のデバイスへ自動で接続する">Auto ON</button>
      </div>
      <button class="control-btn danger" id="btn-disconnect" title="Disconnect">Disconnect</button>
    </div>
  </div>

  <div class="resources" id="resources" title="30秒ごとに更新。拡張ホストは他拡張と共有のプロセス。">計測中…</div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
