<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{cspMeta}}
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <!--
    文言は拡張ホストが翻訳して埋め込む（vscode.l10n は webview からは触れない）。
    表示前に揃うので、後から差し替えて一瞬英語が見える、が起きない。
    実行しないデータブロックなので CSP の script-src には掛からない。
    data-i18n = textContent、data-i18n-title = title 属性、data-i18n-icon = 先頭の記号。
  -->
  <script type="application/json" id="l10n-strings">{{l10n}}</script>

  <!-- ステータス行: 1 本のピル型に「ドット・デバイス名（<select>）・バックエンドバッジ」を並べる。
       select は透明化して枠だけを status-header が担い、全体の一体感を出す。 -->
  <div class="status-header">
    <span class="lamp" id="lamp" data-i18n-title="lampDisconnected" title="Disconnected"></span>
    <div class="select-wrap">
      <select id="device">
        <option value="" data-i18n="selectDevice">Select Device…</option>
      </select>
    </div>
    <span class="backend-badge" id="mode" data-backend="" style="display: none;" data-i18n-title="modeTitle" title="Input path."></span>
  </div>

  <div class="stage">
    <div class="phone-frame">
      <span class="side-btn side-mute"></span>
      <span class="side-btn side-vol"></span>
      <span class="side-btn side-power"></span>
      <!-- tabindex: 打鍵と貼り付けを受け取るため（main.js が pointerdown でフォーカスを取る） -->
      <div class="simulator-container" id="simulator-container" tabindex="-1">
        <img id="simulator-img" style="display: none;" alt="" />
        <canvas id="touch-overlay"></canvas>
        <div class="overlay" id="overlay">
          <span data-i18n="selectToStart">Select a device to start</span>
          <!-- エラー時だけ出す復帰導線（Retry / Show Logs） -->
          <div class="overlay-actions" id="overlay-actions">
            <button class="control-btn" id="btn-retry" data-i18n="retry">Retry</button>
            <button class="control-btn" id="btn-logs" data-i18n="showLogs">Show Logs</button>
          </div>
        </div>
        <!-- 録画開始前の秒読み。数字だけなので翻訳は要らない。 -->
        <div class="countdown hidden" id="countdown"></div>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="control-btn" id="btn-home" data-i18n-title="home" title="Home">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="home">Home</span>
        </button>
        <button class="control-btn" id="btn-back" data-i18n-title="back" title="Back">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="back">Back</span>
        </button>
      </div>
      <div class="btn-group">
        <button class="control-btn" id="btn-shot" data-i18n-title="shotTitle" title="Save a screenshot">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span data-i18n="shot">Shot</span>
        </button>
        <button class="control-btn" id="btn-record" data-i18n-title="recordTitle" title="Record the screen to a video file">
          <svg class="icon rec-dot" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
          <span id="btn-record-label">Rec</span>
        </button>
      </div>
      <div class="btn-group">
        <button class="control-btn" id="btn-auto" data-i18n-title="autoTitle" title="Connect automatically to a running device"><span id="btn-auto-label">Auto ON</span></button>
      </div>
      <button class="control-btn danger" id="btn-disconnect" data-i18n-title="disconnect" title="Disconnect"><span data-i18n="disconnect">Disconnect</span></button>
    </div>
  </div>

  <div class="resources">
    <span id="stats" data-i18n="measuring" data-i18n-title="statsTitle" title="Updated every 30 seconds.">Measuring…</span>
  </div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
