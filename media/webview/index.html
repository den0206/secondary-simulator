<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{cspMeta}}
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <!--
    文言は拡張ホストが翻訳して埋め込む（vscode.l10n は webview からは触れない）。
    表示前に揃うので、後から差し替えて一瞬英語が見える、が起きない。
    実行しないデータブロックなので CSP の script-src には掛からない。
    data-i18n = textContent、data-i18n-title = title 属性、data-i18n-icon = 先頭の記号。
  -->
  <script type="application/json" id="l10n-strings">{{l10n}}</script>

  <div class="toolbar">
    <div class="select-wrap">
      <select id="device">
        <option value="" data-i18n="selectDevice">Select Device…</option>
      </select>
    </div>
    <span class="lamp" id="lamp" data-i18n-title="lampDisconnected" title="Disconnected"></span>
    <button class="icon-btn" id="btn-refresh" data-i18n-title="refresh" title="Refresh the device list">↻</button>
  </div>

  <div class="stage">
    <div class="phone-frame">
      <span class="side-btn side-mute"></span>
      <span class="side-btn side-vol"></span>
      <span class="side-btn side-power"></span>
      <!-- tabindex: 打鍵と貼り付けを受け取るため（main.js が pointerdown でフォーカスを取る） -->
      <div class="simulator-container" id="simulator-container" tabindex="-1">
        <img id="simulator-img" style="display: none;" alt="" />
        <canvas id="touch-overlay"></canvas>
        <div class="overlay" id="overlay">
          <span data-i18n="selectToStart">Select a device to start</span>
          <!-- エラー時だけ出す復帰導線（Retry / Show Logs） -->
          <div class="overlay-actions" id="overlay-actions">
            <button class="control-btn" id="btn-retry" data-i18n="retry">Retry</button>
            <button class="control-btn" id="btn-logs" data-i18n="showLogs">Show Logs</button>
          </div>
        </div>
        <!-- 録画開始前の秒読み。数字だけなので翻訳は要らない。 -->
        <div class="countdown hidden" id="countdown"></div>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="control-btn" id="btn-home" data-i18n="home" data-i18n-icon="⌂" data-i18n-title="home" title="Home">⌂ Home</button>
        <button class="control-btn" id="btn-back" data-i18n="back" data-i18n-icon="‹" data-i18n-title="back" title="Back">‹ Back</button>
      </div>
      <div class="btn-group">
        <button class="control-btn" id="btn-shot" data-i18n="shot" data-i18n-icon="◉" data-i18n-title="shotTitle" title="Save a screenshot">◉ Shot</button>
        <button class="control-btn" id="btn-record" data-i18n-title="recordTitle" title="Record the screen to a video file">● Rec</button>
      </div>
      <div class="btn-group">
        <button class="control-btn" id="btn-trail" data-i18n-title="trailTitle" title="Show tap ripples and drag trails">Trail ON</button>
        <button class="control-btn" id="btn-auto" data-i18n-title="autoTitle" title="Connect automatically to a running device">Auto ON</button>
      </div>
      <button class="control-btn danger" id="btn-disconnect" data-i18n="disconnect" data-i18n-title="disconnect" title="Disconnect">Disconnect</button>
    </div>
  </div>

  <div class="resources">
    <span class="chip mode" id="mode" style="display: none;" data-i18n-title="modeTitle" title="Input path. HID injects straight into the device (fast); WDA goes through mobilecli (compatible)."></span>
    <span id="stats" data-i18n="measuring" data-i18n-title="statsTitle" title="Updated every 30 seconds.">Measuring…</span>
  </div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
