<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{cspMeta}}
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <div class="device-selector">
    <select id="device">
      <option value="">Select Device...</option>
    </select>
  </div>

  <div class="simulator-container" id="simulator-container">
    <canvas id="simulator-canvas" style="display: none;"></canvas>
    <img id="simulator-img" style="display: none;" alt="" />
    <canvas id="touch-overlay"></canvas>
    <div class="overlay" id="overlay">
      <span>Select a device to start</span>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="btn-home" title="Home">Home</button>
    <button class="control-btn" id="btn-back" title="Back">Back</button>
    <button class="control-btn" id="btn-disconnect" title="Disconnect">Disconnect</button>
  </div>

  <div class="resources" id="resources" title="30秒ごとに更新。拡張ホストは他拡張と共有のプロセス。">計測中…</div>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
