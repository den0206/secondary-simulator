  <rect x="86" y="132" width="32" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="86" y="164" width="32" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
  <rect x="86" y="196" width="32" height="10" rx="5" fill="#ffffff" opacity="0.55"/>

  <!-- デバイス本体 -->
  <rect x="182" y="72" width="268" height="368" rx="44" fill="#ffffff"/>
  <rect x="206" y="104" width="220" height="288" rx="20" fill="url(#screen)"/>
  <rect x="286" y="86" width="60" height="10" rx="5" fill="#bae6fd"/>
  <rect x="276" y="410" width="80" height="12" rx="6" fill="#bae6fd"/>

  <!-- タップのリップル（リアルタイム操作） -->
